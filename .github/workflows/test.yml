name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: Package smoke test
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          package=$(npm pack --silent)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          npm init -y >/dev/null
          npm install "$root/$package" --offline
          cli=./node_modules/.bin/joons-mcp-audit-trail
          "$cli" --version
          "$cli" append audit.jsonl --type first
          "$cli" append audit.jsonl --type second
          "$cli" verify audit.jsonl
